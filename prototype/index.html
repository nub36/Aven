<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aven — визуальный прототип (демо)</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%235a5fd8'/><text x='16' y='22' font-size='18' font-weight='bold' text-anchor='middle' fill='white' font-family='Arial'>A</text></svg>">
  <!-- Cache-busting (P0 hotfix, 2026-09-30): GitHub Pages задаёт фиксированный
       Cache-Control: max-age=600 для ВСЕХ файлов без возможности его изменить,
       а прежние теги <link>/<script> не версионировались вовсе. После экстренного
       деплоя устройство (браузер/оператор связи), уже посещавшее прототип, могло
       ещё до 10 минут (а на части мобильных сетей и дольше) получать из кэша
       СТАРЫЕ css/js при уже свежем index.html — то есть в точности воспроизводить
       уже «исправленный» P0-баг после успешного деплоя. Версионный плейсхолдер у
       каждого href/src ниже подставляется workflow'ом
       (.github/workflows/prototype-pages.yml) в SHA коммита перед публикацией,
       поэтому каждый деплой гарантированно инвалидирует кэш всех локальных
       ресурсов ниже. При открытии файла напрямую (file://) или без прогона через
       workflow плейсхолдер остаётся как есть — это валидная строка query,
       браузер её игнорирует при разрешении пути к файлу. -->
  <link rel="stylesheet" href="css/style.css?v=__ASSET_VERSION__">
  <link rel="stylesheet" href="css/character.css?v=__ASSET_VERSION__">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Основная навигация" aria-hidden="true"></aside>
    <div class="main">
      <header class="topbar">
        <button class="icon-btn mobile-menu-btn" id="mobile-menu-btn" data-action="menu-toggle" title="Открыть навигацию" aria-label="Открыть навигацию" aria-controls="sidebar" aria-expanded="false">☰</button>
        <div class="title" id="page-title">Aven</div>
        <span class="demo-badge">ДЕМО · ПРОТОТИП</span>
        <button class="btn small top-android-cta" id="android-cta" data-action="android-download" title="Скачать приложение Aven для Android (APK)">📱 Android</button>
        <button class="icon-btn notif-bell" id="notif-btn" data-action="nav" data-id="notifications" title="Уведомления" aria-label="Уведомления">🔔<span class="notif-badge" id="notif-badge" hidden>0</span></button>
        <button class="icon-btn" id="theme-btn" data-action="theme-toggle" title="Тема: светлая / тёмная / как в системе">🌙</button>
        <button class="icon-btn" id="logout-btn" data-action="logout" title="Выйти из аккаунта (демо)">⎋</button>
        <button class="avatar" data-action="nav" data-id="profile" title="Профиль: Алексей (демо)">А</button>
      </header>
      <main class="content" id="page"></main>
    </div>
  </div>

  <button class="nav-backdrop" id="nav-backdrop" data-action="menu-close" aria-label="Закрыть навигацию"></button>

  <div id="aven-float-root"></div>
  <div id="modal-root"></div>
  <div id="toasts"></div>

  <!-- Порядок скриптов важен. Классические скрипты (без модулей) — прототип открывается и с file:// -->
  <!-- Cache-busting: см. комментарий у <link rel="stylesheet"> в <head>. -->
  <script src="js/data.js?v=__ASSET_VERSION__"></script>
  <script src="js/app-download.js?v=__ASSET_VERSION__"></script>
  <script src="js/state.js?v=__ASSET_VERSION__"></script>
  <script src="js/ui.js?v=__ASSET_VERSION__"></script>
  <script src="js/character.js?v=__ASSET_VERSION__"></script>
  <script src="js/presence.js?v=__ASSET_VERSION__"></script>
  <script src="js/tts/normalize.js?v=__ASSET_VERSION__"></script>
  <script src="assets/voice-samples/manifest.js?v=__ASSET_VERSION__"></script>
  <script src="js/tts/providers.js?v=__ASSET_VERSION__"></script>
  <script src="js/voice.js?v=__ASSET_VERSION__"></script>
  <script src="js/actions.js?v=__ASSET_VERSION__"></script>
  <script src="js/notify.js?v=__ASSET_VERSION__"></script>
  <script src="js/suggestions.js?v=__ASSET_VERSION__"></script>
  <script src="js/daily.js?v=__ASSET_VERSION__"></script>
  <script src="js/command.js?v=__ASSET_VERSION__"></script>
  <script src="js/command-session.js?v=__ASSET_VERSION__"></script>
  <script src="js/tutorial.js?v=__ASSET_VERSION__"></script>
  <script src="js/help.js?v=__ASSET_VERSION__"></script>
  <script src="js/pages1.js?v=__ASSET_VERSION__"></script>
  <script src="js/pages2.js?v=__ASSET_VERSION__"></script>
  <!-- Экраны утреннего обзора и итогов дня: после pages1 (используют общие рендереры и формы). -->
  <script src="js/daily-ui.js?v=__ASSET_VERSION__"></script>
  <script src="js/tools.js?v=__ASSET_VERSION__"></script>
  <script src="js/settings.js?v=__ASSET_VERSION__"></script>
  <!-- Срез Stage 1.0: история действий (даёт A.logAction), админка, экраны аккаунта. Порядок важен. -->
  <script src="js/history.js?v=__ASSET_VERSION__"></script>
  <script src="js/admin.js?v=__ASSET_VERSION__"></script>
  <script src="js/auth.js?v=__ASSET_VERSION__"></script>
  <script src="js/app.js?v=__ASSET_VERSION__"></script>
</body>
</html>
