# Aven — сравнение VPS-кандидатов TTS + честная проба «1 CPU» (этап 5, docs/TTS_RESEARCH.md §19).
#
# Запуск ТОЛЬКО вручную (Actions → VPS TTS Compare → Run workflow) или через repository_dispatch
# (тот же смысл): при обычном push НЕ запускается.
#
# Что делает:
#   1) собирает RHVoice (GPL/LGPL, голоса elena GPL-3.0 + dasha-rus CC BY-SA 4.0) из исходников;
#   2) скачивает Silero v5_cis_base (MIT) с models.silero.ai;
#   3) запускает research/tts/vps_compare.py ЦЕЛИКОМ под taskset -c 0 (одно ядро!):
#      генерирует недостающие фразы для prototype/voice-compare.html и меряет
#      load/RSS/latency каждым движком на ОДНОМ ядре — это цифры для VPS 1 CPU, не экстраполяция;
#   4) публикует компактный набор в ВЕТКУ ботом github-actions (как tts-research.yml):
#      MP3 финалистов → prototype/assets/voice-samples/vps/, vps_probe.json → research/tts/results/
#      (полные WAV и логи остаются только в артефактах vps-tts-compare / vps-tts-probe).
#      Причина: артефакты Actions лежат в Azure blob, недоступном из песочницы агента;
#      публикация в ветку — устоявшийся способ репо доставлять сэмплы до GitHub Pages.
#
# Платные сервисы и ключи не используются. GPU не нужен.

name: VPS TTS Compare

on:
  workflow_dispatch:
  repository_dispatch:
    types: [vps-tts-compare]
  # Ручной запуск до попадания workflow на main (там workflow_dispatch недоступен для ветки):
  # триггер срабатывает ТОЛЬКО при изменении marker-файла в ЭТОЙ ветке.
  push:
    branches: [arena/01a0dc3a-aven-3d-vps-tts]
    paths: ['.github/triggers/vps-tts-compare.txt']

permissions:
  contents: read

concurrency:
  group: vps-tts-compare-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  RHVOICE_COMMIT: '7725bb9cb15e09492c5d448d9b20c57ddf706644'  # пиннинг для воспроизводимости

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Зависимости (scons, libao, ffmpeg)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq scons pkg-config libao-dev ffmpeg >/dev/null
          ffmpeg -version | head -1

      - name: Сборка RHVoice (elena + dasha-rus)
        run: |
          set -e
          git init -q /tmp/RHVoice
          cd /tmp/RHVoice
          git remote add origin https://github.com/RHVoice/RHVoice.git
          git fetch --depth 1 origin "$RHVOICE_COMMIT"
          git checkout -q FETCH_HEAD
          git submodule update --init --depth 1 --recursive \
            external cmake/thirdParty/sanitizers src/third-party/cldr
          git submodule update --init --depth 1 \
            data/languages/Russian data/voices/elena data/voices/dasha-rus
          scons -j"$(nproc)" >/tmp/rhvoice-build.log 2>&1 || { tail -40 /tmp/rhvoice-build.log; exit 1; }
          sudo scons install >/dev/null 2>&1 || { tail -20 /tmp/rhvoice-build.log; exit 1; }
          # scons install кладёт libRHVoice_core.so в /usr/local/lib — без ldconfig бинарник
          # её не находит (exit 127, проверено прогоном)
          sudo ldconfig
          which RHVoice-test
          echo "Слушаю." | RHVoice-test -p elena -o /tmp/check.wav && ls -la /tmp/check.wav

      - name: Python-зависимости (torch CPU, silero-stress)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy silero-stress

      - name: Генерация + проба 1 CPU (taskset -c 0)
        run: |
          mkdir -p research/tts/out/logs
          # ВСЁ (генерация и замеры) на одном ядре — честные цифры для VPS 1 CPU
          taskset -c 0 python research/tts/vps_compare.py 2>&1 | tee research/tts/out/logs/vps_compare.log
          echo "--- vps_probe.json ---"
          cat research/tts/out/vps-probe/vps_probe.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vps-tts-compare
          path: research/tts/out/vps-compare/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vps-tts-probe
          path: |
            research/tts/out/vps-probe/
            research/tts/out/logs/
          if-no-files-found: warn

  # Публикация компактного набора в ветку ботом (паттерн tts-research.yml).
  # Полные WAV/логи — только в артефактах (14 дней).
  publish:
    needs: compare
    if: needs.compare.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - uses: actions/download-artifact@v4
        with:
          pattern: vps-tts-*
          path: artifacts

      - name: MP3 финалистов → prototype/assets/voice-samples/vps; probe → research/tts/results
        run: |
          set -e
          SRC=artifacts/vps-tts-compare
          DST=prototype/assets/voice-samples/vps
          rm -rf "$DST"
          mkdir -p "$DST"
          for v in ru_aigul ru_vika ru_zara; do
            mkdir -p "$DST/silero-$v"
            find "$SRC/silero_cis_mit/$v" -maxdepth 1 -name '*.mp3' -exec cp -f {} "$DST/silero-$v/" \; 2>/dev/null || true
          done
          mkdir -p "$DST/rhvoice-elena" "$DST/rhvoice-dasha-rus"
          find "$SRC/rhvoice/elena"     -maxdepth 1 -name '*.mp3' -exec cp -f {} "$DST/rhvoice-elena/" \; 2>/dev/null || true
          find "$SRC/rhvoice/dasha-rus" -maxdepth 1 -name '*.mp3' -exec cp -f {} "$DST/rhvoice-dasha-rus/" \; 2>/dev/null || true
          echo "— опубликованные MP3:"
          find "$DST" -name '*.mp3' | sort
          test "$(find "$DST" -name '*.mp3' | wc -l)" -gt 0 || { echo "нет MP3 — publish прерывается"; exit 1; }
          mkdir -p research/tts/results
          find artifacts/vps-tts-probe -name 'vps_probe.json' -exec cp -f {} research/tts/results/ \;
          find artifacts/vps-tts-probe -name 'vps_compare.log' -exec cp -f {} research/tts/results/ \; || true
          test -f research/tts/results/vps_probe.json || { echo "нет vps_probe.json"; exit 1; }
          du -sh "$DST" research/tts/results/vps_probe.json

      - name: Commit results to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prototype/assets/voice-samples/vps research/tts/results
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "research(tts): VPS-сравнение этапа 5 — MP3 финалистов + проба 1 CPU (run ${{ github.run_id }})"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 10
          done
          exit 1
