# Aven — публикация визуального UX-прототипа (/prototype) на GitHub Pages.
#
# Это ТОЛЬКО инфраструктура preview прототипа (UX/продуктовое проектирование).
# Это НЕ production-деплой: Aven production пока не существует; технология
# прототипа (статический HTML/CSS/JS) не является ADR и не влияет на выбор
# production-стека (см. docs/DECISIONS.md, docs/PROJECT_PLAN.md).

name: Prototype Pages

on:
  # Ручной запуск: Actions → Prototype Pages → Run workflow (выбрать ветку)
  workflow_dispatch:

  # Автоматическое обновление preview при изменениях прототипа.
  # Ветки перечислены ЯВНО (main + текущая рабочая ветка сессии);
  # предположений о main/master, которых нет в репозитории, не делается.
  # Если основная ветка изменится — дополните/замените список ниже.
  push:
    branches:
      - main
      - arena/01a0d7ec-aven
      # Примечание: рабочие ветки сессий НЕ деплоятся на Pages — environment
      # protection rules разрешают деплой только main (см. WORK_LOG 2026-09-25 VI).
      # Preview рабочей ветки — локальный статический сервер или sandbox.
    paths:
      - 'prototype/**'
      - '.github/workflows/prototype-pages.yml'

# Минимально необходимые права для официальных Pages actions.
# actions: read требуется actions/deploy-pages@v5.
permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

# Одновременные деплои не нужны: новый запуск отменяет предыдущий
concurrency:
  group: prototype-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # P0 cache-busting hotfix (2026-09-30): GitHub Pages отдаёт ВСЕ файлы с
      # фиксированным Cache-Control: max-age=600 без возможности это изменить, а
      # prototype/index.html раньше ссылался на css/js БЕЗ версии — после экстренного
      # деплоя устройство, уже посещавшее прототип, могло до ~10 минут (а на части
      # мобильных сетей дольше) получать из кэша СТАРЫЕ ресурсы при уже свежем HTML.
      # Плейсхолдер __ASSET_VERSION__ в prototype/index.html заменяется SHA коммита
      # ТОЛЬКО в артефакте деплоя (изменение не коммитится в репозиторий) —
      # каждый новый деплой гарантированно инвалидирует кэш всех локальных ресурсов.
      - name: Подставить версию ресурсов (cache-busting) в index.html
        run: |
          set -e
          test -f prototype/index.html
          before=$(grep -c '__ASSET_VERSION__' prototype/index.html || true)
          if [ "$before" -eq 0 ]; then
            echo "::error::__ASSET_VERSION__ не найден в prototype/index.html — cache-busting не применится."
            exit 1
          fi
          sed -i "s/__ASSET_VERSION__/${GITHUB_SHA}/g" prototype/index.html
          remaining=$(grep -c '__ASSET_VERSION__' prototype/index.html || true)
          echo "Заменено вхождений: $before; версия: ${GITHUB_SHA}; осталось плейсхолдеров: $remaining"
          if [ "$remaining" -ne 0 ]; then
            echo "::error::Не все вхождения __ASSET_VERSION__ заменены."
            exit 1
          fi

      # Публикуется ТОЛЬКО содержимое /prototype:
      # index.html оказывается в корне сайта, поэтому проектный URL
      # вида https://<username>.github.io/<repository>/ работает без вложенности.
      - name: Upload prototype as Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: prototype

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
